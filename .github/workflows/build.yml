---
name: build
on:
  push:
    branches:
      - ga
  pull_request:

env:
  # Key for upload write access to  cloudsmith repo
  # Blank on PRs: upload scripts and git-push skip when secrets are empty
  CLOUDSMITH_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLOUDSMITH_API_KEY || '' }}

  # git-push setup
  GIT_REPO: ${{ secrets.GIT_REPO }}
  GIT_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.GIT_KEY_PASSWORD || '' }}

  # Custom Cloudsmith repos instead of hardcoded defaults in Plugin.cmake
  CLOUDSMITH_UNSTABLE_REPO: ${{ secrets.CLOUDSMITH_UNSTABLE_REPO }}
  CLOUDSMITH_STABLE_REPO: ${{ secrets.CLOUDSMITH_STABLE_REPO }}
  CLOUDSMITH_BETA_REPO: ${{ secrets.CLOUDSMITH_BETA_REPO }}

jobs:
  flatpak-x86_64:
    # ubuntu-22.04 like CircleCI: build script uses pip --user (PEP 668 on 24.04)
    runs-on: ubuntu-22.04
    env:
      OCPN_TARGET: flatpak
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      BRANCH: 2408
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak x86_64
        run: ci/circleci-build-flatpak.sh

      - name: Upload tarball
        run: cd /build-flatpak; /bin/bash < upload.sh

      - name: Upload metadata
        run: python3 ci/git-push

  msvc:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - platform: Win32
            arch: x86
          - platform: x64
            arch: x64
    env:
      PLATFORM: ${{ matrix.platform }}
      CONFIGURATION: RelWithDebInfo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build, upload and push metadata
        shell: cmd
        run: call ci\appveyor.bat
